# Rate-limit the paid ERC-8183 endpoint at the proxy edge, where the real
# client IP is still visible. The SDK behind the proxy only sees 127.0.0.1, so
# its own limiter collapses all callers into one bucket — this is the effective
# per-client guard. (http context: this file is included inside http{}.)
limit_req_zone $binary_remote_addr zone=erc8183:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=public_api:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name solvent.gudman.xyz;

    include /etc/nginx/snippets/acme-challenge.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name solvent.gudman.xyz;

    ssl_certificate /etc/letsencrypt/live/solvent.gudman.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solvent.gudman.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    limit_req_status 429;

    root /var/www/solvent;
    index index.html;

    # Public JSON API (the receipt server) — keep canonical paths working.
    location = /receipts {
        limit_req zone=public_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3078;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Standalone auditor script — exact match wins over the /verify prefix proxy.
    location = /verify_receipts.py {
        try_files $uri =404;
    }
    location = /verify {
        limit_req zone=public_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3078;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /state {
        limit_req zone=public_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3078;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /inference-proofs {
        limit_req zone=public_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3078;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /inference-commitments {
        limit_req zone=public_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3078;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /inference-verification {
        limit_req zone=public_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3078;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /policy {
        limit_req zone=public_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3078;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /policy-compliance {
        limit_req zone=public_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3078;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /passport {
        limit_req zone=public_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3078;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /signal {
        limit_req zone=public_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3078;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /strategy-evidence {
        limit_req zone=public_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3078;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Paid ERC-8183 provider (solvent-erc8183.service, port 3079). Only expose
    # this when the service is enabled (SOLVENT_ERC8183_ENABLED=1) with a
    # non-zero price; otherwise the upstream is down and this returns 502.
    location /erc8183 {
        limit_req zone=erc8183 burst=10 nodelay;
        proxy_pass http://127.0.0.1:3079;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /summary {
        limit_req zone=public_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3078/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ERC-8004 registration at the tokenURI root. Inverted negotiation:
    # browsers always send text/html first and keep the dashboard; everything
    # else (curl/python "*/*", "application/json", header-less indexer
    # fetchers — 8004scan's parser's Accept header is unknown) gets the
    # registration JSON. rewrite...last inside if is one of nginx's safe ifs.
    location = / {
        if ($http_accept !~* "text/html") {
            rewrite ^ /agent-registration.json last;
        }
        try_files /index.html =404;
    }

    # The glass-box dashboard (static, self-contained).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
