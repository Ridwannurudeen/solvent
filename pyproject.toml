[project]
name = "solvent"
version = "0.1.0"
description = "SOLVENT — the glass-box trading agent (BNB Hack: AI Trading Agent Edition)"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "web3==7.16.0",
    "bnbagent==0.3.6",
    "anthropic==0.109.1",
    "fastapi==0.137.1",
    "uvicorn==0.49.0",
    "eth-account==0.13.7",
    "aiohttp==3.14.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["solvent*"]
