<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; }
  html,body { width:1200px; height:630px; }
  body { background:#0b0e11; color:#eaecef; font-family:"Inter",system-ui,sans-serif; position:relative; overflow:hidden; }
  .bar { position:absolute; top:0; left:0; right:0; height:6px; background:#f0b90b; }
  .glow { position:absolute; width:760px; height:760px; right:-220px; top:-260px; background:radial-gradient(circle, #f0b90b22, transparent 62%); }
  .pad { position:absolute; inset:0; padding:72px 80px; display:flex; flex-direction:column; }
  .top { display:flex; align-items:center; gap:18px; }
  .top .name { font-size:30px; font-weight:700; letter-spacing:.12em; }
  .top .chain { font-size:15px; font-weight:500; color:#f0b90b; border:1px solid #4a3c0e; background:#f0b90b14; padding:6px 13px; border-radius:7px; letter-spacing:.05em; }
  .eyebrow { margin-top:72px; font:600 18px ui-monospace,monospace; letter-spacing:.22em; text-transform:uppercase; color:#f0b90b; }
  h1 { margin-top:20px; font-size:88px; line-height:1.0; font-weight:700; letter-spacing:-.02em; }
  h1 .hl { color:#f0b90b; }
  p { margin-top:26px; font-size:27px; line-height:1.45; color:#848e9c; max-width:880px; }
  .foot { position:absolute; left:80px; bottom:64px; font:500 18px ui-monospace,monospace; color:#5e6673; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="glow"></div>
  <div class="pad">
    <div class="top">
      <svg width="46" height="46" viewBox="0 0 32 32"><path fill="#F0B90B" d="M16 3l4 4-4 4-4-4zM16 21l4 4-4 4-4-4zM7 12l4 4-4 4-4-4zM25 12l4 4-4 4-4-4zM16 12l4 4-4 4-4-4z"/></svg>
      <span class="name">SOLVENT</span>
      <span class="chain">BNB CHAIN</span>
    </div>
    <div class="eyebrow">Autonomous · On-chain · Verifiable</div>
    <h1>Every decision,<br><span class="hl">receipted.</span></h1>
    <p>A glass-box trading agent. Every decision is a hash-chained receipt, anchored on-chain and verifiable by anyone.</p>
    <div class="foot">solvent.gudman.xyz</div>
  </div>
</body>
</html>
